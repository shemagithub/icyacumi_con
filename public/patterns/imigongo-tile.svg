<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <!-- Seamless Imigongo tile: solid triangles + parallel chevron ridges -->
  <g fill="#1a1410" stroke="#1a1410" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- downward solid -->
    <polygon stroke="none" points="20,4 36,44 4,44"/>
    <!-- upward open chevron (two ridges) -->
    <path fill="none" d="M44 44 L60 6 L76 44"/>
    <path fill="none" d="M51 44 L60 22 L69 44"/>
    <!-- upward solid -->
    <polygon stroke="none" points="100,44 116,4 132,44"/>
    <!-- downward open chevron (two ridges) -->
    <path fill="none" d="M124 4 L140 42 L156 4"/>
    <path fill="none" d="M131 4 L140 26 L149 4"/>
  </g>
</svg>
